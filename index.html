<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUDDY SYSTEM // TERMINAL</title>
    <style>
        body {
            background-color: #080808;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .terminal-container {
            border: 2px solid #00ff66;
            padding: 30px;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.25);
            text-align: center;
            max-width: 500px;
            width: 85%;
        }

        h1 {
            font-size: 1.1rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        input[type="text"] {
            background-color: #111;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 10px;
            font-family: inherit;
            font-size: 1rem;
            width: 65%;
            text-align: center;
            outline: none;
        }

        button {
            background-color: #00ff66;
            color: #000;
            border: none;
            padding: 10px 15px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #00cc52;
        }

        #message {
            margin-top: 15px;
            color: #ff3333;
            font-size: 0.85rem;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <h1>G.R. DEVLOG // DATABASE ACCESS</h1>
        <p>Enter clearance keyword:</p>
        
        <div>
            <input type="text" id="keywordInput" placeholder="ENTER CODE..." onkeypress="handleKeyPress(event)">
            <button onclick="submitKeyword()">EXECUTE</button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        function submitKeyword() {
            let input = document.getElementById("keywordInput").value.trim().toLowerCase();
            let msg = document.getElementById("message");

            if (input === "buddy") {
                window.location.href = "lore_buddy.html";
            } else if (input === "raze") {
                window.location.href = "vessel_raze.html";
            } else if (input === "stormy" || input === "</stormy_face>") {
                window.location.href = "corrupted_file.html";
            } else {
                msg.innerText = "ACCESS DENIED: INVALID CLEARANCE KEYWORD";
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                submitKeyword();
            }
        }
    </script>

</body>
</html>
