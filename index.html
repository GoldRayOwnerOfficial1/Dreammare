<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREAMMARE // TERMINAL</title>
    <style>
        body {
            background-color: #080808;
            color: rgb(45, 45, 45);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: rgb(45, 45, 45);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }

        .terminal-container {
            border: 2px solid rgb(45, 45, 45);
            padding: 30px;
            background-color: #000;
            box-shadow: 0 0 20px rgba(45, 45, 45, 0.4);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 1.1rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .media-preview {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .media-box {
            border: 1px dashed rgb(45, 45, 45);
            padding: 10px;
            background-color: #0a0a0a;
            max-width: 45%;
        }

        .media-box img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .media-label {
            font-size: 0.75rem;
            color: rgb(45, 45, 45);
            margin-top: 5px;
        }

        input[type="text"] {
            background-color: #111;
            border: 1px solid rgb(45, 45, 45);
            color: rgb(45, 45, 45);
            padding: 10px;
            font-family: inherit;
            font-size: 1rem;
            width: 60%;
            text-align: center;
            outline: none;
        }

        button {
            background-color: rgb(45, 45, 45);
            color: #000;
            border: none;
            padding: 10px 15px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(75, 75, 75);
        }

        #message {
            margin-top: 15px;
            color: #a00;
            font-size: 0.85rem;
            height: 20px;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startExperience()">
        <p>[ SYSTEM RESTRICTED ]</p>
        <p style="font-size: 0.85rem; color: rgb(45, 45, 45);">CLICK ANYWHERE TO INITIALIZE TERMINAL</p>
    </div>

    <div class="terminal-container">
        <h1>G.R. DEVLOG // DATABASE ACCESS</h1>

        <div class="media-preview">
            <div class="media-box">
                <img src="Raze Render 1.png" alt="Raze Render">
                <div class="media-label">VESSEL LOG</div>
            </div>

            <div class="media-box">
                <img src="Raze Scared.gif" alt="Raze Scared">
                <div class="media-label">SIGNAL FEED</div>
            </div>
        </div>

        <p>Enter clearance keyword:</p>
        
        <div>
            <input type="text" id="keywordInput" placeholder="ENTER CODE..." onkeypress="handleKeyPress(event)">
            <button onclick="submitKeyword()">EXECUTE</button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        function startExperience() {
            let elem = document.documentElement;

            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }

            document.getElementById("overlay").style.display = "none";
        }

        function submitKeyword() {
            let input = document.getElementById("keywordInput").value.trim().toLowerCase();
            let msg = document.getElementById("message");

            if (input === "buddy") {
                window.location.href = "lore_buddy.html";
            } else if (input === "raze") {
                window.location.href = "raze.html";
            } else if (input === "stormy" || input === "</stormy_face>") {
                window.location.href = "corrupted_file.html";
            } else {
                msg.innerText = "ACCESS DENIED: INVALID CLEARANCE KEYWORD";
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                submitKeyword();
            }
        }
    </script>

</body>
</html>
