<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREAMMARE // SUBJECT: RAZE</title>
    <style>
        body {
            background-color: #080808;
            color: rgb(45, 45, 45);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .terminal-container {
            border: 2px solid rgb(45, 45, 45);
            padding: 30px;
            background-color: #000;
            box-shadow: 0 0 20px rgba(45, 45, 45, 0.4);
            text-align: center;
            max-width: 650px;
            width: 90%;
        }

        h1 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .status-tag {
            font-size: 0.8rem;
            color: #a00;
            margin-bottom: 25px;
        }

        .media-preview {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .media-box {
            border: 1px dashed rgb(45, 45, 45);
            padding: 10px;
            background-color: #0a0a0a;
            max-width: 45%;
        }

        .media-box img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .media-label {
            font-size: 0.75rem;
            color: rgb(45, 45, 45);
            margin-top: 8px;
        }

        .log-entry {
            border-top: 1px solid rgb(45, 45, 45);
            margin-top: 20px;
            padding-top: 15px;
            font-size: 0.85rem;
            text-align: left;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            color: #000;
            background-color: rgb(45, 45, 45);
            padding: 8px 16px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
        }

        a:hover {
            background-color: rgb(75, 75, 75);
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <h1>SUBJECT FILE // RAZE</h1>
        <div class="status-tag">[ CLEARANCE GRANTED — FILE UNLOCKED ]</div>

        <div class="media-preview">
            <div class="media-box">
                <img src="Raze Render 1.png" alt="Raze Render">
                <div class="media-label">VESSEL LOG</div>
            </div>

                <img src="Raze Scared.gif" alt="Raze Scared">
